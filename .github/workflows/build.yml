name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.9.0"
      - name: Resolve library versions (as the phone does)
        run: |
          rel() { M=$(curl -s "$1/maven-metadata.xml"); V=$(echo "$M" | grep -o '<release>[^<]*' | cut -d'>' -f2); [ -n "$V" ] || V=$(echo "$M" | grep -o '<latest>[^<]*' | cut -d'>' -f2); [ -n "$V" ] || V=$(echo "$M" | grep -o '<version>[^<]*' | tail -1 | cut -d'>' -f2); echo "$V"; }
          KSP=$(rel https://repo1.maven.org/maven2/com/google/devtools/ksp/symbol-processing-gradle-plugin)
          ROOM=$(rel https://dl.google.com/dl/android/maven2/androidx/room/room-compiler)
          COIL=$(rel https://repo1.maven.org/maven2/io/coil-kt/coil3/coil-compose)
          DS=$(rel https://dl.google.com/dl/android/maven2/androidx/datastore/datastore-preferences)
          echo "::notice::KSP=$KSP ROOM=$ROOM COIL=$COIL DS=$DS"
          sed -i "s/@KSP@/$KSP/" build.gradle.kts
          sed -i "s/@ROOM@/$ROOM/g; s/@COIL@/$COIL/; s/@DS@/$DS/" app/build.gradle.kts
      - name: Signing key and Gradle wrapper (created once, then reused)
        run: |
          CHANGED=""
          if [ ! -f app/signing.keystore ]; then
            keytool -genkeypair -keystore app/signing.keystore -storepass android -keypass android -alias app -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Arin"
            git add app/signing.keystore
            CHANGED=1
          fi
          # gradlew + its jar, so the project also opens and builds in Android Studio with no setup.
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version "9.9.0" --distribution-type bin && chmod +x gradlew
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            CHANGED=1
          fi
          if [ -n "$CHANGED" ]; then
            git config user.name "Arin"
            git config user.email "arin@users.noreply.github.com"
            git commit -m "Add signing key and Gradle wrapper"
            git push origin HEAD:${{ github.ref_name }} || echo "Couldn't save them; this build still works."
          fi
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not resolve|FAILURE" -A2 build.log | head -60 | while IFS= read -r l; do
            echo "::error::${l//%/%25}"
          done
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app-*.apk
          make_latest: true
